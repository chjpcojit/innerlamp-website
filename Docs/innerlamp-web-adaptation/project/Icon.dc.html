<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{ px }};height:{{ px }};flex:none;border-radius:{{ rad }};background:{{ tint }};position:relative;overflow:hidden">
  <div style="position:absolute;left:0;top:0;width:44px;height:44px;transform:scale({{ k }});transform-origin:0 0">
    <sc-if value="{{ isBook }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:9px;top:13px;width:12px;height:18px;border-radius:3px 1px 1px 3px;background:{{ tone }};transform:skewY(8deg)"></div><div style="position:absolute;left:23px;top:13px;width:12px;height:18px;border-radius:1px 3px 3px 1px;background:{{ tone }};transform:skewY(-8deg)"></div></sc-if>
    <sc-if value="{{ isTalk }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:10px;top:18px;width:4px;height:8px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:17px;top:12px;width:4px;height:20px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:24px;top:15px;width:4px;height:14px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:31px;top:19px;width:4px;height:6px;border-radius:2px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isMed }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:18px;top:9px;width:8px;height:8px;border-radius:50%;background:{{ tone }}"></div><div style="position:absolute;left:15px;top:19px;width:14px;height:10px;border-radius:7px 7px 3px 3px;background:{{ tone }}"></div><div style="position:absolute;left:9px;top:28px;width:26px;height:7px;border-radius:999px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isLamp }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:18px;top:8px;width:8px;height:13px;border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;background:{{ tone }}"></div><div style="position:absolute;left:10px;top:24px;width:24px;height:9px;border-radius:0 0 12px 12px;background:{{ tone }}"></div><div style="position:absolute;left:19px;top:33px;width:6px;height:3px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isMo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:9px;top:12px;width:26px;height:20px;border-radius:50% 50% 46% 46% / 56% 56% 44% 44%;background:{{ tone }}"></div><div style="position:absolute;left:13px;top:23px;width:18px;height:2px;border-radius:1px;background:#F7F2E8"></div></sc-if>
    <sc-if value="{{ isBeads }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ beads }}" as="b" hint-placeholder-count="9"><div style="position:absolute;left:{{ b.x }};top:{{ b.y }};width:{{ b.s }};height:{{ b.s }};border-radius:50%;background:{{ tone }}"></div></sc-for><div style="position:absolute;left:20px;top:35px;width:4px;height:5px;border-radius:1px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isBell }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:13px;top:10px;width:18px;height:18px;border-radius:9px 9px 2px 2px;background:{{ tone }}"></div><div style="position:absolute;left:9px;top:28px;width:26px;height:3px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:19px;top:32px;width:6px;height:5px;border-radius:0 0 3px 3px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isJournal }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:12px;top:9px;width:20px;height:26px;border-radius:3px;background:{{ tone }}"></div><div style="position:absolute;left:16px;top:16px;width:12px;height:2px;border-radius:1px;background:#F7F2E8"></div><div style="position:absolute;left:16px;top:21px;width:9px;height:2px;border-radius:1px;background:#F7F2E8"></div></sc-if>
    <sc-if value="{{ isProgress }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;box-sizing:border-box;border:4px solid {{ ring }}"></div><div style="position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;box-sizing:border-box;border:4px solid transparent;border-top-color:{{ tone }};border-right-color:{{ tone }};transform:rotate(20deg)"></div></sc-if>
    <sc-if value="{{ isLotus }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:17px;top:9px;width:10px;height:20px;border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;background:{{ tone }}"></div><div style="position:absolute;left:10px;top:13px;width:9px;height:17px;border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;background:{{ tone }};transform:rotate(-38deg);transform-origin:50% 100%;opacity:.8"></div><div style="position:absolute;left:25px;top:13px;width:9px;height:17px;border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;background:{{ tone }};transform:rotate(38deg);transform-origin:50% 100%;opacity:.8"></div><div style="position:absolute;left:11px;top:31px;width:22px;height:3px;border-radius:2px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isTree }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:18px;top:8px;width:8px;height:8px;border-radius:50%;background:{{ tone }}"></div><div style="position:absolute;left:21px;top:15px;width:2px;height:9px;background:{{ tone }}"></div><div style="position:absolute;left:13px;top:23px;width:18px;height:2px;background:{{ tone }}"></div><div style="position:absolute;left:13px;top:23px;width:2px;height:6px;background:{{ tone }}"></div><div style="position:absolute;left:29px;top:23px;width:2px;height:6px;background:{{ tone }}"></div><div style="position:absolute;left:10px;top:28px;width:8px;height:8px;border-radius:50%;background:{{ tone }}"></div><div style="position:absolute;left:26px;top:28px;width:8px;height:8px;border-radius:50%;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isPlus }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:12px;top:20px;width:20px;height:4px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:20px;top:12px;width:4px;height:20px;border-radius:2px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isCalendar }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:11px;top:12px;width:22px;height:21px;border-radius:4px;background:{{ tone }}"></div><div style="position:absolute;left:16px;top:9px;width:3px;height:6px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:25px;top:9px;width:3px;height:6px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:11px;top:17px;width:22px;height:2px;background:#F7F2E8"></div><div style="position:absolute;left:19px;top:23px;width:6px;height:6px;border-radius:50%;background:#F7F2E8"></div></sc-if>
    <sc-if value="{{ isGear }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:13px;top:13px;width:18px;height:18px;border-radius:4px;background:{{ tone }}"></div><div style="position:absolute;left:13px;top:13px;width:18px;height:18px;border-radius:4px;background:{{ tone }};transform:rotate(45deg)"></div><div style="position:absolute;left:18px;top:18px;width:8px;height:8px;border-radius:50%;background:#F7F2E8"></div></sc-if>
    <sc-if value="{{ isTemple }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:20.5px;top:8px;width:3px;height:6px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:7px;top:13px;width:30px;height:7px;border-radius:50% 50% 2px 2px / 100% 100% 2px 2px;background:{{ tone }}"></div><div style="position:absolute;left:12px;top:20px;width:20px;height:14px;border-radius:1px;background:{{ tone }}"></div><div style="position:absolute;left:19px;top:25px;width:6px;height:9px;border-radius:3px 3px 0 0;background:#F7F2E8"></div></sc-if>
    <sc-if value="{{ isNotif }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:13px;top:11px;width:18px;height:17px;border-radius:9px 9px 2px 2px;background:{{ tone }}"></div><div style="position:absolute;left:10px;top:27px;width:24px;height:3px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:19px;top:31px;width:6px;height:4px;border-radius:0 0 3px 3px;background:{{ tone }}"></div><div style="position:absolute;left:27px;top:8px;width:8px;height:8px;border-radius:50%;background:#C2857F;box-shadow:0 0 0 2px #F7F2E8"></div></sc-if>
    <sc-if value="{{ isWheel }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:9px;top:9px;width:26px;height:26px;border-radius:50%;box-sizing:border-box;border:3.5px solid {{ tone }}"></div><div style="position:absolute;left:21px;top:11px;width:2px;height:22px;background:{{ tone }};border-radius:1px;transform:rotate(0deg)"></div><div style="position:absolute;left:21px;top:11px;width:2px;height:22px;background:{{ tone }};border-radius:1px;transform:rotate(45deg)"></div><div style="position:absolute;left:21px;top:11px;width:2px;height:22px;background:{{ tone }};border-radius:1px;transform:rotate(90deg)"></div><div style="position:absolute;left:21px;top:11px;width:2px;height:22px;background:{{ tone }};border-radius:1px;transform:rotate(135deg)"></div><div style="position:absolute;left:18px;top:18px;width:8px;height:8px;border-radius:50%;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isBuddha }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:12px;top:6px;width:20px;height:20px;border-radius:50%;box-sizing:border-box;border:2px solid {{ tone }};opacity:.55"></div><div style="position:absolute;left:17px;top:11px;width:10px;height:10px;border-radius:50%;background:{{ tone }}"></div><div style="position:absolute;left:13px;top:21px;width:18px;height:10px;border-radius:9px 9px 3px 3px;background:{{ tone }}"></div><div style="position:absolute;left:8px;top:30px;width:28px;height:6px;border-radius:999px;background:{{ tone }}"></div></sc-if>
    <sc-if value="{{ isPhoto }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:9px;top:11px;width:26px;height:22px;border-radius:4px;background:{{ tone }}"></div><div style="position:absolute;left:26px;top:15px;width:5px;height:5px;border-radius:50%;background:#F7F2E8"></div><div style="position:absolute;left:13px;top:21px;width:0px;height:0px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid #F7F2E8"></div><div style="position:absolute;left:20px;top:24px;width:0px;height:0px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:6px solid #F7F2E8"></div></sc-if>
    <sc-if value="{{ isArticle }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:12px;top:8px;width:20px;height:28px;border-radius:3px 8px 3px 3px;background:{{ tone }}"></div><div style="position:absolute;left:16px;top:14px;width:12px;height:2px;border-radius:1px;background:#F7F2E8"></div><div style="position:absolute;left:16px;top:19px;width:12px;height:2px;border-radius:1px;background:#F7F2E8"></div><div style="position:absolute;left:16px;top:24px;width:12px;height:2px;border-radius:1px;background:#F7F2E8"></div><div style="position:absolute;left:16px;top:29px;width:7px;height:2px;border-radius:1px;background:#F7F2E8"></div></sc-if>
    <sc-if value="{{ isChat }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:8px;top:10px;width:28px;height:19px;border-radius:9px;background:{{ tone }}"></div><div style="position:absolute;left:13px;top:27px;width:0;height:0;border-left:3px solid transparent;border-right:6px solid transparent;border-top:7px solid {{ tone }}"></div><div style="position:absolute;left:14px;top:18px;width:4px;height:4px;border-radius:50%;background:#F7F2E8"></div><div style="position:absolute;left:20px;top:18px;width:4px;height:4px;border-radius:50%;background:#F7F2E8"></div><div style="position:absolute;left:26px;top:18px;width:4px;height:4px;border-radius:50%;background:#F7F2E8"></div></sc-if>
    <sc-if value="{{ isRoutine }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:9px;top:9px;width:26px;height:26px;border-radius:50%;box-sizing:border-box;border:3px solid {{ tone }};border-right-color:transparent;transform:rotate(-45deg)"></div><div style="position:absolute;left:21px;top:14px;width:2.5px;height:9px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:21px;top:21px;width:7px;height:2.5px;border-radius:2px;background:{{ tone }}"></div><div style="position:absolute;left:31px;top:8px;width:5px;height:5px;border-radius:50%;background:{{ tone }};opacity:.6"></div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;44px&quot;,&quot;height&quot;:&quot;44px&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;book&quot;,&quot;talk&quot;,&quot;med&quot;,&quot;lamp&quot;,&quot;mo&quot;,&quot;beads&quot;,&quot;bell&quot;,&quot;journal&quot;,&quot;progress&quot;,&quot;lotus&quot;,&quot;tree&quot;,&quot;plus&quot;,&quot;calendar&quot;,&quot;gear&quot;,&quot;temple&quot;,&quot;notif&quot;,&quot;wheel&quot;,&quot;buddha&quot;,&quot;photo&quot;,&quot;article&quot;,&quot;chat&quot;,&quot;routine&quot;],&quot;default&quot;:&quot;book&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B8862F&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;rgba(184,134,47,.14)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:44,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, kind = p.kind || 'book', size = +(p.size || 44), tone = p.tone || '#B8862F';
    const beads = [];
    for (let i = 0; i < 9; i++) { const a = Math.PI / 2 + ((i + 1) / 10) * Math.PI * 2, cx = 22 + 11 * Math.cos(a), cy = 20 + 11 * Math.sin(a); beads.push({ x: (cx - 2.5).toFixed(1) + 'px', y: (cy - 2.5).toFixed(1) + 'px', s: '5px' }); }
    return {
      px: size + 'px', k: String(size / 44), rad: Math.round(size * 0.3) + 'px', tint: p.tint || 'rgba(184,134,47,.14)', tone, ring: 'rgba(34,30,25,.12)', beads,
      isBook: kind === 'book', isTalk: kind === 'talk', isMed: kind === 'med', isLamp: kind === 'lamp', isMo: kind === 'mo', isBeads: kind === 'beads', isBell: kind === 'bell', isJournal: kind === 'journal', isProgress: kind === 'progress', isLotus: kind === 'lotus', isTree: kind === 'tree', isPlus: kind === 'plus', isCalendar: kind === 'calendar', isGear: kind === 'gear', isTemple: kind === 'temple', isNotif: kind === 'notif', isWheel: kind === 'wheel', isBuddha: kind === 'buddha', isPhoto: kind === 'photo', isArticle: kind === 'article', isChat: kind === 'chat', isRoutine: kind === 'routine',
    };
  }
}
</script>
</body>
</html>
